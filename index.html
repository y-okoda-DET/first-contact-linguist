<body>
<style>
/* single committed look: dusk CRT, sodium orange, teal phosphor */
:root{
  color-scheme:dark;
  --bg:#17151f; --surface:#221f2c; --sunk:#131119; --ink:#ece0c8; --muted:#a3978c; --line:#3b3547;
  --accent:#ff9a5a; --accent-ink:#1a1016; --accent-soft:#3a2a2a; --teal:#7fd1c1;
  --good:#9fd67a; --bad:#ff6f66; --warn:#f4c95d;
  --sc-sweet:#e79ab8; --sc-resin:#9fd67a; --sc-sour:#f4c95d; --sc-bitter:#a8887a;
  --pix-on:#7fd1c1; --pix-off:#262233;
  --shadow:#0b0a10;
  --display:"DotGothic16","Hiragino Sans",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"VT323","DotGothic16",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(120% 80% at 50% 0%,#241f33 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:14px 48px;min-height:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.14) 2px 3px)}
.app{max-width:580px;margin:0 auto;position:relative}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--mono);font-size:17px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase;line-height:1}
h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.35;margin:0;text-wrap:balance;text-shadow:0 0 12px rgba(255,154,90,.35)}
h2{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.4;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:15px;margin:0;letter-spacing:.04em}
p{margin:0}
b{color:var(--accent);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible,.kami:focus-visible{outline:2px dashed var(--accent);outline-offset:3px}
.head{display:flex;flex-direction:column;gap:6px}
.lead{color:var(--muted);font-size:14px}
.objbar{position:sticky;top:8px;z-index:40;background:var(--surface);border:2px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:baseline;box-shadow:3px 3px 0 var(--shadow)}
.objbar .k{font-family:var(--mono);font-size:13px;color:var(--teal);letter-spacing:.06em;white-space:nowrap;flex:none}
.objbar b{font-weight:400;font-family:var(--display);color:var(--ink);font-size:14px;line-height:1.4}
.mono{font-family:var(--mono);font-size:16px;letter-spacing:.06em}
/* pixel canvases */
canvas.px{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#0f0e15}
.stage,.portrait,.crtbox{position:relative;border:2px solid #000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px var(--line),4px 4px 0 2px var(--shadow)}
.crtbox::after,.kami-frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%);}
/* HUD */
.status{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-family:var(--mono);font-size:19px;line-height:1;font-variant-numeric:tabular-nums;color:var(--teal)}
.status .k{color:var(--muted);font-family:var(--body);font-size:12px;margin-right:6px}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pip{width:10px;height:10px;border:2px solid var(--teal);background:transparent}
.pip.on{background:var(--teal);box-shadow:0 0 6px var(--teal)}
.pips.bad .pip{border-color:var(--bad)} .pips.bad .pip.on{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.bubble{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-family:var(--mono);font-size:26px;line-height:1;letter-spacing:.08em;background:var(--ink);color:#1a1016;border:2px solid #000;padding:4px 14px 2px;white-space:nowrap;box-shadow:3px 3px 0 #000;transition:opacity .25s}
.bubble[data-empty="1"]{opacity:0}
.narr{background:var(--sunk);border:2px solid var(--line);padding:10px 14px;min-height:52px;font-size:14px;position:relative}
.narr::before{content:"▍";color:var(--teal);margin-right:4px;animation:blink 1s steps(1) infinite}
.narr.good{border-color:var(--good)} .narr.bad{border-color:var(--bad)}
@keyframes blink{50%{opacity:0}}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
/* controls */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);padding:5px 12px;font-size:14px;box-shadow:2px 2px 0 var(--shadow)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip small{color:var(--muted);font-size:11px;margin-left:4px}
.chip:disabled{opacity:.35;cursor:not-allowed}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts.two{grid-template-columns:repeat(2,1fr)}
.act{border:2px solid var(--ink);background:var(--surface);padding:8px 6px;font-size:14px;font-weight:700;line-height:1.35;text-align:center;box-shadow:3px 3px 0 var(--shadow)}
.act span{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.act:active:not(:disabled),.chip:active:not(:disabled),.primary:active,.opt:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.act:disabled{opacity:.3;cursor:not-allowed}
.opt{border:2px solid var(--line);background:var(--surface);padding:10px 14px;text-align:left;font-size:14px;line-height:1.6;width:100%;box-shadow:3px 3px 0 var(--shadow)}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:#1f2a1f}
.opt.wrong{border-color:var(--bad);background:#2d1c1f}
.opt .tag{font-family:var(--mono);font-size:15px;color:var(--teal);display:block;line-height:1}
.optlist{display:flex;flex-direction:column;gap:8px}
.wait{border:2px dashed var(--muted);background:transparent;padding:8px;font-size:14px;color:var(--muted);width:100%}
.primary{background:var(--accent);color:var(--accent-ink);border:2px solid #000;padding:12px;font-family:var(--display);font-size:16px;width:100%;box-shadow:4px 4px 0 var(--shadow)}
.ghost{background:transparent;border:2px solid var(--line);padding:10px;font-size:14px;width:100%;color:var(--ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow>*{flex:1 1 140px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}
.tab{background:none;border:none;padding:8px 12px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;font-size:13.5px}
.log li{display:grid;grid-template-columns:44px 1fr;gap:6px}
.log .t{font-family:var(--mono);font-size:16px;color:var(--teal);line-height:1.3}
.log li.good .x{color:var(--good)} .log li.bad .x{color:var(--bad)}
.card{background:var(--surface);border:2px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:4px 4px 0 var(--shadow)}
.card ul,.card ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.card.note{border-color:var(--teal)}
.card.note p{font-size:14px}
.card.note cite{font-style:normal;color:var(--muted);font-size:12px}
details.obs{background:var(--surface);border:2px solid var(--line);padding:10px 14px;font-size:13.5px}
details.obs summary{cursor:pointer;font-family:var(--display);font-size:14px;color:var(--teal)}
details.obs ol{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.memory{background:var(--sunk);border:2px dashed var(--line);padding:10px 14px;font-size:13.5px}
.memory ul{margin:4px 0 0;padding-left:1.2em}
.alog{font-family:var(--mono);font-size:17px;line-height:1.25;color:var(--teal);background:#0c0f10;border:2px solid #000;padding:12px;display:flex;flex-direction:column;gap:4px;text-shadow:0 0 6px rgba(127,209,193,.45)}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font-weight:400;color:var(--muted);font-size:12px}
.cmp td:first-child{font-family:var(--mono);font-size:16px;white-space:nowrap}
.scroll{overflow-x:auto}
.focusline{font-size:13px;color:var(--muted)}
.focusline b{color:var(--ink)}
.line{font-family:var(--display);font-size:22px;line-height:1.55}
.cue{font-size:13px;color:var(--muted)}
.route{font-family:var(--mono);font-size:18px;color:var(--teal);line-height:1}
/* title / story */
.title-screen{padding-top:10px}
.big{font-size:34px;line-height:1.25}
.kicker{font-family:var(--display);font-size:14px;color:var(--accent);letter-spacing:.06em}
.prose{display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.95}
.comm{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--teal);padding:4px 0 4px 12px}
.cl{display:flex;flex-direction:column;font-size:14px}
.cl .who{font-family:var(--mono);font-size:16px;color:var(--teal);letter-spacing:.06em;line-height:1.1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.cl .ts{color:var(--muted);letter-spacing:.04em}
.cl p{margin:0 0 4px}
.kami .cl .ts{color:#7d7066}
.kami{background:var(--ink);color:#231c1a;border:3px solid #000;box-shadow:6px 6px 0 var(--shadow);cursor:pointer;animation:slidein .35s ease-out}
.kami .kami-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:17px;padding:6px 10px 4px;border-bottom:3px solid #000;background:#d9ccb2;line-height:1}
.kdots{display:flex;gap:3px}.kdots i{width:6px;height:6px;background:#a3978c}.kdots i.on{background:#e0612b}
.kami-frame{position:relative;border-bottom:3px solid #000}
.kami-body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.kami .kicker{color:#b8461a}
.kami .prose{font-size:15.5px}
.kami .comm{border-left-color:#2f7d73}
.kami .cl .who{color:#2f7d73}
.kami b{color:#b8461a}
@keyframes slidein{from{opacity:0;transform:translateX(18px) rotate(.6deg)}to{opacity:1;transform:none}}
.fragment{background:#0c0f10;color:var(--teal);border:2px solid #000;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-shadow:0 0 8px rgba(127,209,193,.5)}
.fragment .mono{color:var(--muted);text-shadow:none}
.fragment p{font-family:var(--display);font-size:21px;line-height:1.5}
.summons{font-family:var(--display);font-size:15px;line-height:2}
.summons .fr{color:var(--line);margin-right:4px}
.summons .fr.on{color:var(--teal)}
.summons-full .sline{font-family:var(--display);font-size:18px;line-height:1.6;display:flex;flex-direction:column}
.summons-full .sline .mono{font-size:14px;opacity:.7}
.site{font-size:13px;color:var(--muted)}
.site>span:first-child{font-family:var(--mono);font-size:16px;border:2px solid var(--line);padding:0 6px;margin-right:6px;color:var(--accent)}
.site .mono{color:var(--teal)}
.hints{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14px}
/* plate */
.plate{margin:0;background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
.plate-hd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:17px;padding:6px 10px 4px;color:var(--teal);line-height:1;border-bottom:2px solid var(--line)}
.plate figcaption{padding:10px 14px;font-size:12.5px;color:var(--muted)}
.plate figcaption ul{margin:0;padding-left:1.1em}
@media (min-width:520px){.plate figcaption ul{columns:2;column-gap:18px}}
/* map */
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.stagerow{width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:baseline;box-shadow:3px 3px 0 var(--shadow)}
.stagerow:disabled{opacity:.4;cursor:not-allowed}
.stagerow.cleared{border-color:var(--good)}
.stagerow .sn{font-family:var(--mono);font-size:22px;color:var(--accent);grid-row:span 2;line-height:1}
.stagerow .st{font-family:var(--display);font-size:17px}
.stagerow .sc{grid-column:2;font-size:12px;color:var(--muted)}
.stagerow.cleared .sc{color:var(--good)}
.stagerow.held{border-color:var(--warn);border-style:dashed}
.stagerow .hold{color:var(--warn)}
.skipbtn{display:flex;flex-direction:column;align-items:center;gap:2px;border-style:dashed;color:var(--muted);font-family:var(--display)}
.skipbtn span{font-family:var(--body);font-size:11px}
.small-links{display:flex;gap:14px;flex-wrap:wrap}
.linkbtn{background:none;border:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline}
/* stage 2 */
.tl{display:grid;gap:3px;font-family:var(--mono);font-size:17px;width:max-content}
.tl .rl{font-family:var(--body);font-size:11px;color:var(--muted);white-space:nowrap;align-self:center;padding-right:4px}
.tl .c{height:28px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:13px}
.tl .c.cur{outline:2px solid var(--accent);outline-offset:-2px}
.tl .rl{position:sticky;left:0;z-index:2;background:var(--bg);align-self:stretch;display:flex;align-items:center;border-right:2px solid var(--line);box-shadow:4px 0 6px rgba(0,0,0,.5)}
.tlwrap{scroll-behavior:auto;padding-bottom:6px;overscroll-behavior-x:contain}
.tlhint{margin-top:-4px;font-size:11px}
.tl .c.fut{opacity:.4}
.tl .c.hi{background:#5a4a1e;color:var(--warn)}
.tl .c.lo{background:#1e3a4a;color:var(--teal)}
.tl .c.x{background:#4a1e22;color:var(--bad)}
.tl .bn{font-size:14px;color:var(--muted);text-align:center}
.ticks{display:flex;gap:3px}.ticks i{flex:1;height:6px;background:var(--line)}.ticks i.on{background:var(--teal)}
.recorder{background:#0c0f10;border:2px solid #000;padding:10px 14px}
.recorder .lbl{color:var(--teal)}
.recorder ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.recorder li{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px}
.recorder .who{font-size:11px;color:var(--muted);min-width:96px}
.recorder b{display:inline-block;min-width:26px;text-align:center;padding:1px 4px;font-family:var(--display);font-weight:400}
.recorder b.hi{background:#5a4a1e;color:var(--warn)}
.recorder b.lo{background:#1e3a4a;color:var(--teal)}
/* stage 3 */
.glyph{font-family:var(--display);font-size:22px;line-height:1;min-width:46px;min-height:46px;border:2px solid var(--line);background:var(--surface);padding:6px 8px;display:inline-flex;flex-direction:column;align-items:center;gap:3px;box-shadow:2px 2px 0 var(--shadow)}
.glyph small{font-family:var(--body);font-size:10px;color:var(--muted)}
.glyph[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.formation{display:inline-flex;gap:6px;font-family:var(--display);font-size:24px}
.formation span{border:2px solid var(--teal);color:var(--teal);min-width:42px;text-align:center;padding:2px 6px;background:#0c0f10}
/* stage 6 */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:36px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;position:relative}
.bar .fill{height:100%;transition:width .4s;background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.35) 6px 8px)}
.bar .n{font-family:var(--mono);font-size:18px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
/* stage 7 */
.bits{font-family:var(--mono);font-size:16px;word-break:break-all;line-height:1.15;background:#0c0f10;color:var(--teal);border:2px solid #000;padding:10px;max-height:120px;overflow-y:auto;letter-spacing:.08em}
.pix{display:grid;gap:2px;width:max-content;max-width:100%;margin:0 auto}
.pix i{width:14px;height:14px;background:var(--pix-off)}
.pix i.on{background:var(--pix-on);box-shadow:0 0 4px var(--pix-on)}
.pix i.void{background:transparent;outline:1px dashed var(--line)}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchips .chip{padding:2px 8px;font-family:var(--mono);font-size:18px;min-width:38px;line-height:1.2}
/* stage 8/9 */
.corpus{background:#0c0f10;border:2px solid #000;padding:10px 14px;font-size:13px}
.corpus b{color:var(--teal);font-weight:400;font-family:var(--display)}
.corpus ul{margin:4px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.timer{height:8px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--teal);width:100%;transition:width .25s linear}
.timer.low i{background:var(--bad)}
.voices{display:flex;flex-direction:column;gap:10px}
.voice{border:2px solid var(--line);background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:3px 3px 0 var(--shadow)}
.voice .vw{font-family:var(--mono);font-size:17px;color:var(--teal);letter-spacing:.06em;line-height:1}
.voice .vo{font-size:13px;color:var(--muted)}
.voice .vt{font-family:var(--display);font-size:17px;color:var(--ink)}
/* notebook */
.note-row{display:grid;grid-template-columns:56px 1fr;gap:6px 10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.note-row .w{font-family:var(--mono);font-size:22px;line-height:1}
.note-row input{width:100%;font:inherit;font-size:14px;padding:6px 10px;border:2px solid var(--line);background:var(--sunk);color:var(--ink)}

function auRecover(){
  if(!AU.ctx||!AU.on)return;
  const c=AU.ctx;
  if(c.state!=='running'){try{c.resume();}catch(e){}}
  setTimeout(()=>{
    if(!AU.on||document.hidden)return;
    if(!AU.ctx||AU.ctx.state!=='running'){
      try{AU.ctx&&AU.ctx.close();}catch(e){}
      clearInterval(AU.timer);AU.ctx=null;AU.vox=null;AU.playing=false;
      if(auInit()){auResume();musicStart();}
    }else if(!AU.playing)musicStart();
  },350);

const tr=st=>{st.turn++;if(st.turn>MAXT&&!st.over){st.alog.push('地球個体の情報、不十分。群れは移動を開始する。');lose({title:'群れは去った',text:'必要な情報が揃わないまま、ツブラの群れは次の土地へ移っていった。',alog:st.alog.slice(-6),extra:extra(st)});}};

function extra(st){return `<div class="scroll"><table class="cmp"><tr><th>記号</th><th>本当の意味</th></tr>${Object.keys(EV).map(k=>`<tr><td>${EV[k].g}</td><td>${EVTRUE[k]}</td></tr>`).join('')}</table></div>
<div class="scroll"><table class="cmp"><tr><th>問い</th><th>正しい答え</th></tr>${QS.map(q=>`<tr><td>${TH[q.thing].g}？</td><td>〔${TH[q.thing].g}〕〔${PL[q.place].g}〕〔${EV[q.ev].g}〕　${TH[q.thing].n}・${PL[q.place].n}・${EVTRUE[q.ev]}</td></tr>`).join('')}</table></div>`;}
function send(st,mode){
  const s=st.sel,q=QS[st.q];

  if(mode==='one'){st.alog.push('地球個体が群れの断片に話しかけた。無礼。');distrust(st,`あなたは手前の一匹だけに${f}を見せた。群れ全体が強い光をあなたに浴びせた。`);tr(st);return;}

  if(s.ev!==q.ev){
    st.alog.push(`地球個体の情報${f}：内容は確認できた。しかし——`);distrust(st,`あなたは${f}を掲げた。斥候が戻ってきて、群れ全体に何かを掲げた。群れの半分があなたに体を向け、光を弱めた。`);tr(st);return;}
  st.alog.push(`地球個体の情報${f}を受理。群れに共有。`);st.q++;
  voice('tsubura','good');say(st,`あなたは群れ全体に${f}を掲げた。群れの全員が一斉に同じ記号を掲げ直した。情報が群れに共有された。`,'good');
  st.sel={thing:null,place:null,ev:null};
  if(st.q>=QS.length){st.alog.push('地球個体を、群れの情報源の一つとして認める。');win({title:'群れに迎え入れられた',text:'ツブラは、あなたを信頼できる情報源として群れの記憶に加えた。群れの外周に、あなたの居場所がひとつ空けられた。',alog:st.alog.slice(-6),extra:extra(st)});return;}
  tr(st);
}
function art(st){

}
function glyphs(kind,obj,st,gloss){return Object.keys(obj).map(k=>`<button class="glyph" data-a="${kind}" data-v="${k}" aria-pressed="${st.sel[kind]===k}">${obj[k].g}${gloss?`<small>${obj[k].n}</small>`:'<small>&nbsp;</small>'}</button>`).join('');}
return {
  title:'群れの問い',species:'ツブラ',concept:'証拠性（エビデンシャリティ）',
  lead:'群体「ツブラ」が、記号を掲げてこの土地について尋ねてくる。',
  rules:['群れの3つの問いに、記号の組で答える', '10ターン', '群れの不信が3回たまる'],
  hints:['追放された一匹は、物も場所も正しかったのかもしれない。','◉を掲げた個体と◌を掲げた個体。同じ情報なのに、何が違っていたか。','三つ目の記号は、何を知っているかではなく、どうやって知ったかに関係しているようだ。あなたの記憶を、知り方ごとに分けてみよう。'],
  init(){return {turn:1,dis:0,q:0,obs:0,sel:{thing:null,place:null,ev:null},log:[],alog:[],narr:{text:'群れが一斉にあなたの方を向いた。群れの上に、記号が掲げられている。',kind:''}};},
  view(st){const q=QS[st.q];
    return `${H.status(H.num('ターン',`${pad2(st.turn)}/${MAXT}`),H.pips('不信',st.dis,3,true),H.num('答えた問い',`${st.q}/3`))}
    <div class="stage">${canvas('s3',{q:'?'})}</div>
    <div class="memory"><b>あなたの記憶</b><ul>
      <li>着陸したとき、南の丘で澄んだ水たまりのそばを歩いた。</li>
      <li>先発の隊員が「北の谷に果実のなる木があった」と話していた。</li>
      <li>西の岩場に、巨大な足跡が続いていた。まだ新しかった。</li></ul></div>
    ${H.narr(st.narr)}
    <div><div class="lbl">群れの問い</div><div class="formation"><span>${TH[q.thing].g}</span><span>？</span></div></div>
    <div><div class="lbl">物</div><div class="chips">${glyphs('thing',TH,st,true)}</div></div>
    <div><div class="lbl">場所</div><div class="chips">${glyphs('place',PL,st,true)}</div></div>
    <div><div class="lbl">三つ目の記号（意味は観察して推理する）</div><div class="chips">${glyphs('ev',EV,st,false)}</div></div>
    <div class="acts two">${H.act('send','群れ全体に掲げる','1ターン',false,'all')}${H.act('send','手前の一匹に見せる','1ターン',false,'one')}</div>
    <button class="wait" data-a="obs" ${st.obs>=OBS.length?'disabled':''}>群れを観察する（1ターン）${st.obs>=OBS.length?'：新しい出来事はもうない':`：残り${OBS.length-st.obs}場面`}</button>
    ${H.log(st.log)}`;},
  act(st,a,v){

    if(a==='obs'){if(st.obs<OBS.length){voice('tsubura','');say(st,`観察${st.obs+1}：${OBS[st.obs]}`);st.obs++;tr(st);}return;}
    if(a==='send'){send(st,v);return;}
  },
  onStart(st){voice('tsubura','');},
  note:`<p>ツブラの三つ目の記号は、情報を<b>どうやって知ったか</b>を示すものだった。◉は自分の目で見た、◌は他者から聞いた、◇は痕跡から推測した。言語学ではこれを<b>証拠性（エビデンシャリティ）</b>と呼ぶ。</p>
  <p>ツブラの記号そのものは架空だが、仕組みは実在する。南米アマゾンのトゥユカ語については、見た・見ずに感じた・痕跡から判断した・人から聞いた・推測した、の5つを動詞の語尾で区別するという報告がある。ただし、こうした区別をいくつと数えるか、どこまでを文法とみなすかは、研究者のあいだでも議論が続いている。トルコ語の -miş は伝聞や推論を表し、ケチュア語は -mi（直接知っている）、-si（聞いた）、-chá（推測）を使い分ける。こうした言語では、情報源を示さずに文を言い切ることがそもそもできない。</p>
  <p>日本語にも、情報源の違いを表し分ける表現がある。「雨が降るそうだ」は伝聞、「降りそうだ」は見た目からの推測、「降るらしい」「降るようだ」は根拠のある推定。ただ、日本語では情報源を言わずに「雨が降る」と言い切ることもできる。これらを証拠性の文法とみなすか、話し手の判断を表すモダリティの一部とみなすかは、立場によって分かれる。</p>
  <p>群れで情報を中継するツブラにとって、出どころの偽りは群れ全体を危険にさらす。見てもいない足跡の主を「見た」と言えば、それは嘘になる。</p>
  <cite>参考：A. Y. Aikhenvald, Evidentiality, Oxford University Press (2004)／J. Barnes, Evidentials in the Tuyuca verb, International Journal of American Linguistics 50(3): 255–271 (1984)</cite>`
};
})());
/* ===== Stage 4: ポトラ ===== */
STAGES.push((()=>{
const MAXT=10;
const ITEMS=[{id:'ring',n:'金の指輪'},{id:'pencil',n:'鉛筆'},{id:'seed',n:'種の袋'},{id:'photo',n:'家族の写真'},{id:'salt',n:'塩の包み'},{id:'water',n:'水の瓶'},{id:'song',n:'地球の歌',song:true}];
const GOODS=['羽根','小石','貝','布','琥珀','骨笛'];
function shuf(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}return b;}
let THEIRS={},VAL={};
function deal(st){const g=shuf(GOODS);st.theirs={7:'星図'};g.forEach((n,i)=>st.theirs[i+1]=n);const v=shuf([1,2,3,3,4,5]);st.val={song:6};ITEMS.filter(i=>!i.song).forEach((it,k)=>st.val[it.id]=v[k]);}
function use(st){THEIRS=st.theirs;VAL=st.val;}
const item=id=>{const it=ITEMS.find(i=>i.id===id);return Object.assign({},it,{v:VAL[id]});};
function insult(st,text){voice('potra','bad');st.ins++;say(st,text,'bad');if(st.ins>=3){st.alog.push('この個体との環を断つ。');lose({title:'ポトラは背を向けた',text:'ポトラは荷袋を背負い直し、浜辺を去っていった。一度も振り返らなかった。',alog:st.alog.slice(-6)});}}
function tr(st){st.turn++;if(st.turn>MAXT&&!st.over){st.alog.push('環、完成せず。');lose({title:'潮が満ちた',text:'ポトラは星図を手放さないまま、満ち潮とともに船へ戻っていった。',alog:st.alog.slice(-6)});}}
function extra(st){use(st);return `<div class="scroll"><table class="cmp"><tr><th>あなたの品</th><th>ポトラの品で言えば</th></tr>${ITEMS.map(i=>`<tr><td>${i.n}</td><td>${THEIRS[VAL[i.id]]}（${VAL[i.id]}段目）</td></tr>`).join('')}</table></div>
<p class="focusline">受け取った品より、ちょうど一段上の品を返す。今回のポトラの品の順番：${[1,2,3,4,5,6,7].map(k=>THEIRS[k]).join(' → ')}。</p>`;}
function give(st,id){
  use(st);const it=item(id),need=st.last+1;
  if(it.v<need){st.alog.push(`返礼「${it.n}」：不足。`);insult(st,`あなたは${it.n}を贈った。ポトラはそれを一瞥し、そっとあなたの足元に戻した。`);tr(st);return;}
  if(it.v>need){st.alog.push(`返礼「${it.n}」：過剰。返しようがない。`);insult(st,`あなたは${it.n}を贈った。ポトラは受け取ったまま、長いあいだ体を震わせていた。やがて、それをあなたの足元に戻し、一歩下がった。`);tr(st);return;}
  voice('potra','good');st.inv=st.inv.filter(x=>x!==id);st.owe=0;const gift=THEIRS[it.v+1];st.last=it.v+1;
  st.hist.push({from:'you',n:it.n},{from:'them',n:gift});
  st.alog.push(`返礼「${it.n}」：釣り合う。こちらからは「${gift}」を。`);
  if(st.last===7){G.prog.potra=st.theirs;win({title:'星図を受け取った',text:`あなたが${it.song?'歌い終える':'贈る'}と、ポトラは長いあいだ動かなかった。やがて荷袋の底から、一族が何世代も受け継いできた星図を取り出し、あなたの手に置いた。`,alog:st.alog.slice(-6),extra:extra(st)});return;}
  say(st,`あなたは${it.n}を${it.song?'歌って贈った':'贈った'}。ポトラはそれを受け取り、荷袋から${gift}を取り出して、あなたの足元に置いた。`,'good');tr(st);
}
function art(st){

  <g transform="translate(120 12)"><path d="M0 116 L6 34 Q10 4 24 4 Q38 4 42 34 L48 116 Z" fill="#c9a77a" stroke="var(--ink)" stroke-width="1.5"/>
  <circle cx="18" cy="22" r="3" fill="var(--ink)"/><circle cx="30" cy="22" r="3" fill="var(--ink)"/>
  <path d="M42 54 Q80 64 96 96" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M84 96 Q98 88 112 96 L108 118 Q98 124 88 118 Z" fill="#a98b5f" stroke="var(--ink)"/></g>
  <text x="250" y="60" font-size="12" fill="#17222e" font-family="var(--body)">足元の最後の品</text><text x="250" y="80" font-size="16" fill="#17222e" font-family="var(--display)">${THEIRS[st.last]}</text></svg>`;
}
return {
  title:'返礼の階段',species:'ポトラ',concept:'贈与と互酬性',
  lead:'「ポトラ」は話さない。対話は、物の受け渡しだけ。',
  rules:['一族の星図を受け取る', '10ターン', 'ポトラが3回背を向けかける'],
  hints:['観察記録で、ポトラ同士が受け渡した品を、順番どおりに並べてみよう。','品物を「見せる」と、ポトラは自分の荷袋のどれかに目をやる。その品は、観察記録の列のどこにあったか。','背を向けられた場面と、震えて逃げ出した場面。返した品は、受け取った品より何段ずれていたか。'],
  init(){const st={turn:1,ins:0,last:1,owe:0,inv:ITEMS.map(i=>i.id),sel:null,seen:{},log:[],alog:[]};deal(st);use(st);st.hist=[{from:'them',n:THEIRS[1]}];st.narr={text:`ポトラが近づき、あなたの足元に${THEIRS[1]}を置いた。そして、じっと待っている。`,kind:''};return st;},
  view(st){use(st);

    const memo=Object.keys(st.seen).map(id=>`<li>${item(id).n}を見せた → ポトラは荷袋の<b>${THEIRS[item(id).v]}</b>に目をやった</li>`).join('');
    return `${H.status(H.num('ターン',`${pad2(st.turn)}/${MAXT}`),H.pips('背を向けかけた',st.ins,3,true))}
    <div class="stage">${canvas('s4',{})}</div><p class="focusline">足元にある、ポトラからの最後の品：<b>${THEIRS[st.last]}</b></p>
    <details class="obs" open><summary>事前の観察記録（ポトラ同士のやりとり）</summary><ol>
      <li>Aが${THEIRS[1]}を置くと、Bは${THEIRS[2]}を置いた。Aは次に${THEIRS[3]}を置き、Bは${THEIRS[4]}を置いた。Aが${THEIRS[5]}を置くと、Bは${THEIRS[6]}を置いた。Aは荷袋の底の星図に手をかけ、しばらくして手を離した。</li>
      <li>${THEIRS[3]}を受け取ったポトラが、${THEIRS[1]}を置いた。相手は背を向けて去っていった。</li>
      <li>${THEIRS[2]}を受け取ったポトラが、${THEIRS[5]}を置いた。受け取った側は震えて縮こまり、${THEIRS[5]}を地面に置いて逃げ出した。</li></ol></details>
    ${H.narr(st.narr)}
    <div><div class="lbl">手持ちの品</div><div class="chips">${chips}</div></div>
    <div class="acts">${H.act('give','贈る','1ターン',!st.sel)}${H.act('show','見せる','1ターン',!st.sel)}${H.act('wait','待つ','1ターン')}</div>
    <div class="card"><h3>やりとりの記録</h3><ul>${hist}</ul>${memo?`<h3>見せたときの反応</h3><ul>${memo}</ul>`:''}</div>
    ${H.log(st.log)}`;},
  act(st,a,v){
    if(a==='sel'){st.sel=v;return;}
    use(st);
    if(a==='give'&&st.sel){const id=st.sel;st.sel=null;give(st,id);return;}
    if(a==='show'&&st.sel){voice('potra','');const it=item(st.sel);st.seen[it.id]=true;
      say(st,`あなたは${it.n}${it.song?'の最初の一節を口ずさんだ':'を見せた'}。ポトラはそれを見つめ、それから自分の荷袋の${THEIRS[it.v]}に目をやった。`);st.owe++;
      if(st.owe>=3){st.owe=0;st.alog.push('見せるばかりで、返さない。');insult(st,'ポトラの腕が、だらりと垂れた。');}
      if(!st.over)tr(st);return;}
    if(a==='wait'){st.owe++;say(st,'あなたは何もせずに待った。ポトラも動かない。');
      if(st.owe>=2){st.owe=0;st.alog.push('受け取るばかりで、返さない。');insult(st,'ポトラの腕が、だらりと垂れた。');}
      if(!st.over)tr(st);return;}
  },
  onStart(st){voice('potra','');},
  get note(){const st=G.st&&G.st.val?G.st:null;const ring=st?`${st.theirs[st.val.ring]}（${st.val.ring}段目）`:'最低の品';return `<p>ポトラの規則は、受け取った品より<b>ちょうど一段だけ上</b>の品を返すことだった。少なければ侮辱、多すぎれば相手に恥をかかせる。人間にとって一番高価な金の指輪は、あなたが出会ったポトラにとっては${ring}と同じ値打ちだった。そして最も価値があったのは、形のない歌だった。値打ちの順番そのものは、一族ごとに違う。</p>
  <p>人類学者マルセル・モースは『贈与論』(1925) で、多くの社会の贈与には<b>与える・受け取る・返す</b>という三つの義務があると論じた。贈り物は無償に見えて、実際には返礼の義務を生み、人と人を結びつける。北米北西海岸のポトラッチでは、相手が返しきれないほどの贈与が、相手を圧倒する手段にもなった。今回の現場、ハイダ・グワイもポトラッチの伝統を持つ土地だ。</p>
  <p>価値が社会によって決まることは、マリノフスキーが記録したトロブリアンド諸島のクラ交換がよく示している。実用品ではない貝の首飾りと腕輪が、島々を巡りながら大きな威信を運んでいた。ポトラッチでは、歌や名前も譲り渡される大切な財産だった。</p>
  <p>日本の「半返し」や「内祝い」も、返礼の量を細かく定める文化だ。哲学者オースティンは、「約束します」と言うことがそのまま約束という行為になるような発話を<b>行為遂行的発話</b>と呼んだ。ポトラにとっては、贈ることそのものが発話だった。</p>

function extra(st){return `<div class="stats"><div><span class="k">失ったもの</span><span class="v">${st.lost}</span></div><div><span class="k">守れたもの</span><span class="v">${st.saved}/3</span></div></div>

function resolve(st,choice){

  note:`<p>ヤァの言語には<b>否定</b>がなかった。首を振ることも×を描くことも、彼らには「消し去る」印に見える。彼らに断りを伝えるには、元の提案と<b>いつまでも両立しない光景</b>を、肯定の形で示すしかなかった。「海を持ち帰らない」ではなく、「海がこの星に満ちている」と。</p>
  <p>ここから先は、言語学というより論理学の話になる。論理学では、「持ち帰る／持ち帰らない」のように片方が必ず真になる関係を<b>矛盾</b>、「海が消える／海が満ちている」のように両方同時には成り立たない関係を<b>反対</b>と呼んで区別する。ヤァは否定を持たない代わりに、反対の関係で意思を伝えていた。両立してしまう絵は、断りではなく追加の注文になる。「明日の朝も満ちている」は、翌朝を過ぎれば両立してしまう。</p>
  <p>念のため書いておくと、否定を持たない言語は、知られている限り実在しない。ヤァの言語は、否定がなかったらどうなるかを考えるための思考実験だ。人間の言語はすべて否定の表現を持ち、否定は言語の普遍的な特徴の代表例とされる。子どもの否定の発達には「ない（存在しない）」「いや（拒否）」「ちがう（打ち消し）」という段階があることも知られている。</p>

function extra(st){return `<div class="scroll"><table class="cmp"><tr><th>強い香り</th><th>ネフにとっての意味</th></tr><tr><td>甘</td><td>親しみ・仲間</td></tr><tr><td>樹</td><td>この場所・住まい</td></tr><tr><td>酸</td><td>問い</td></tr><tr><td>苦</td><td>怒り・敵意</td></tr><tr><td>甘＋樹</td><td>「ここで共に暮らそう」</td></tr></table></div>

function checkWin(st){if(won(st.air)){st.alog.push('甘い香りと樹の香りが重なった。「ここで、共に」。');win({title:'「ここで、共に」',text:'甘い香りと樹の香りが重なった。ネフは床に体を伏せ、ゆっくりと甘い香りで応えた。ネフの言葉で「ここで共に暮らそう」という意味だった。',alog:st.alog.slice(-6),extra:extra(st)});return true;}return false;}

    const left=Math.max(0,st.deadline-Date.now())/1000;
    return `${H.status(H.num('発言',`${st.i+1}/${st.T.length}`),H.pips('誤訳',st.miss,3,true),H.num('通訳できた',st.ok))}
    ${fb?'':`<div class="timer ${left<12?'low':''}" id="s9timer"><i style="width:${left/secOf(st)*100}%"></i></div>`}
    <div class="card"><div class="route">${t.from} → ${t.to}</div><p>${t.src}</p></div>
    ${fb?H.narr(st.narr):''}
    ${t.build?opts:`<div class="optlist"><div class="lbl">どう通訳する？</div>${opts}</div>`}
    ${fb?`<button class="primary" data-a="next">${st.i<st.T.length-1?'次の発言へ':'会議場を見渡す'}</button>`:''}
    ${H.log(st.log,'会議の記録')}`;},
  tick(st){if(st.phase!=='task'||st.pick!==null)return;const left=Math.max(0,st.deadline-Date.now())/1000;const el=document.getElementById('s9timer');
    if(el){el.firstElementChild.style.width=(left/secOf(st)*100)+'%';el.classList.toggle('low',left<12);}
    if(left<=0){resolve(st,-1);if(G.screen==='play')render();}},
  act(st,a,v){
    if(a==='onext'){if(st.oi<OPEN.length-1){st.oi++;if(st.oi===1)chorus(false);if(st.oi===3)voice('mimik','tii');}else{st.phase='task';st.deadline=Date.now()+secOf(st)*1000;setTimeout(()=>{const x=st.T[st.i];if(x&&!st.over&&G.st===st)voice(SP_BY_NAME[x.from]);},300);}window.scrollTo(0,0);return;}
    if(a==='sel9'&&st.phase==='task'&&st.pick===null){st.sel9=+v;return;}
    if(a==='pick'&&st.phase==='task'&&st.pick===null&&!st.T[st.i].build&&v!=null&&v!=='undefined'){resolve(st,+v);return;}
    if(st.phase==='task'&&st.pick===null){const t=st.T[st.i];
      if(a==='b'){const [k,val]=v.split(':');const part=t.build.find(p=>p.key===k);if(part.multi){const arr=st.bs[k]||[];const i=arr.indexOf(val);if(i>=0)arr.splice(i,1);else if(arr.length<part.multi)arr.push(val);st.bs[k]=arr;}else st.bs[k]=val;return;}
      if(a==='seq'){const part=t.build.find(p=>p.seq);const arr=st.bs[part.key]||[];if(arr.length<part.seq){arr.push(v);se('tone',v);}st.bs[part.key]=arr;return;}
      if(a==='seqc'){const part=t.build.find(p=>p.seq);st.bs[part.key]=[];return;}
      if(a==='bsend'&&buildReady(st,t)){resolve(st,'b');return;}}
    if(a==='next'&&st.pick!==null){st.i++;st.turn++;st.pick=null;st.bs={};st.bres=null;st.sel9=null;
      if(st.i>=st.T.length){st.phase='reveal';st.alog.push('会議は合意に至った。');window.scrollTo(0,0);return;}
      st.deadline=Date.now()+secOf(st)*1000;setTimeout(()=>{const x=st.T[st.i];if(x&&!st.over&&G.st===st)voice(SP_BY_NAME[x.from]);},300);return;}
    if(a==='voice'){v==='kanal'?voice('kanal','すみません！　お願いがあります。わたしに、通訳の仕事を教えてください。'):voice(v);return false;}
    if(a==='rnext'){if(st.ri<2){st.ri++;if(st.ri===2)chorus(true);window.scrollTo(0,0);return;}
      win({title:'会議は成立した',text:'あなたの仮説辞書は、最後まで仮説のままだった。それでも、九つの言葉は、いま一つの場所で通じ合っている。招集状の最後の一行は、正しかった。橋を架ける者は、ここにいた。',alog:st.alog.slice(-6),extra:extra(st)});}
  },
  note:`<p>最終ステージで求められたのは、語の置き換えではなかった。ツブラに訳すなら情報源を、ヤァに訳すなら否定を使わない形を、ウームに訳すならテンポと返し方を、それぞれ整え直す必要があった。同じ意図でも、相手の言語の流儀に合わせて作り直さなければ届かない。</p>
  <p>言語学者ヤコブソンは1959年の論文で、言語どうしの本質的な違いは「何を言うことができるか」ではなく、<b>「何を言わなければならないか」</b>にある、という趣旨を述べた。証拠性を持つ言語では情報源を言わずに文を作れない。日本語では、相手との関係を示す敬語の選択を避けられない。翻訳とは、原文が言わずに済ませたことを、訳先の言語が要求する形で補うことでもある。</p>
  <p>ステージ1で出会ったクワインは、同じ『ことばと対象』の中で<b>翻訳の不確定性</b>を論じた。どれだけ観察を重ねても、ある言語を別の言語に訳す正解は一つに定まらない、という主張だ。それでも人類は、約7000の言語のあいだで訳し続けてきた。完全な理解ではなく、誤解を管理し続けること。それが、異なる言語どうしの対話の実態なのかもしれない。</p>
  <cite>参考：R. Jakobson, On linguistic aspects of translation (1959)／W. V. O. Quine, Word and Object (1960)</cite>`
};
})());
render();
</script>
